<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upstream picks — what to pull into droid-office</title>
<style>
  :root {
    --bg: #101318; --panel: #181c24; --panel2: #1e242e; --ink: #e6e9ef;
    --muted: #98a2b3; --line: #2a3140; --acc: #4f8cff; --acc2: #7dd3a8;
    --warn: #e8b04b; --chip: #262d3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-bottom: 120px;
  }
  header {
    position: sticky; top: 0; z-index: 20; background: rgba(16,19,24,.97);
    border-bottom: 1px solid var(--line); padding: 14px 22px;
    backdrop-filter: blur(6px);
  }
  header h1 { margin: 0 0 2px; font-size: 17px; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  button {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 13px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--acc); }
  button.primary { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  input[type="search"] {
    background: var(--panel2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 8px; padding: 7px 11px; width: 230px; font-size: 13px;
  }
  .count { color: var(--muted); font-size: 12.5px; margin-left: auto; }
  main { max-width: 1020px; margin: 0 auto; padding: 18px 22px; }
  section {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    margin: 16px 0; overflow: hidden;
  }
  .group-head {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: var(--panel2); border-bottom: 1px solid var(--line);
  }
  .group-head h2 { margin: 0; font-size: 14.5px; }
  .group-head .hint { color: var(--muted); font-size: 12px; }
  .group-head .mini { margin-left: auto; padding: 4px 10px; font-size: 12px; }
  .item {
    display: grid; grid-template-columns: 26px 1fr; gap: 10px;
    padding: 11px 16px; border-top: 1px solid var(--line); cursor: pointer;
  }
  .item:first-of-type { border-top: none; }
  .item:hover { background: #1b212b; }
  .item.checked { background: #1a2432; }
  .item.hidden { display: none; }
  .item input { width: 17px; height: 17px; margin-top: 3px; accent-color: var(--acc); cursor: pointer; }
  .item .title { font-weight: 600; font-size: 13.5px; }
  .item .desc { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chip {
    background: var(--chip); border: 1px solid var(--line); border-radius: 20px;
    padding: 1px 9px; font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace;
  }
  .chip.dep { color: var(--warn); border-color: #4a3c1e; }
  .chip.small { color: var(--acc2); }
  .chip.medium { color: var(--acc); }
  .chip.large { color: #e08c8c; }
  .depnote { color: var(--warn); font-size: 11.5px; margin-top: 5px; }
  .footbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    background: rgba(16,19,24,.97); border-top: 1px solid var(--line);
    padding: 12px 22px; display: flex; gap: 10px; align-items: center;
    backdrop-filter: blur(6px);
  }
  .toast {
    position: fixed; bottom: 74px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--acc2); color: #0c1512; padding: 9px 18px; border-radius: 9px;
    font-weight: 600; opacity: 0; transition: .25s; pointer-events: none; z-index: 40;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #preview {
    width: 100%; height: 150px; background: #0c0f14; color: var(--acc2);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px;
    font: 11.5px/1.5 ui-monospace, monospace; margin-top: 12px; resize: vertical;
  }
  details.preview { margin: 10px 0 0; }
  details.preview summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>

<header>
  <h1>Upstream picks — AgentSystemLabs/agent-office → droid-office</h1>
  <div class="sub">54 upstream commits triaged. Multiplayer, hosting/deploy, minigames and the castle/maps are excluded. Everything below is a granular slice — pick exactly what you want, then hit <b>Copy selection</b> and paste it back to me.</div>
  <div class="toolbar">
    <input type="search" id="filter" placeholder="Filter items…">
    <button onclick="setAll(true)">Select all</button>
    <button onclick="setAll(false)">Clear all</button>
    <span class="count" id="count"></span>
  </div>
</header>

<main id="groups"></main>

<div class="footbar">
  <button class="primary" onclick="copySelection()">Copy selection</button>
  <button onclick="togglePreview()">Show/hide copy preview</button>
  <span class="count" id="footcount"></span>
</div>
<div class="toast" id="toast">Copied to clipboard</div>

const body = document.getElementById('groups');
const state = {};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

for (const g of GROUPS) {
  const sec = el('section');
  const head = el('div', 'group-head');
  const wrap = el('div');
  wrap.appendChild(el('h2', null, g.name));
  wrap.appendChild(el('div', 'hint', g.hint));
  head.appendChild(wrap);
  const mini = el('button', 'mini', 'select group');
  mini.onclick = (ev) => {
    ev.stopPropagation();
    const anyOff = g.items.some(it => !state[it.id]);
    for (const it of g.items) setItem(it.id, anyOff);
  };
  head.appendChild(mini);
  sec.appendChild(head);

  for (const it of g.items) {
    state[it.id] = false;
    const row = el('label', 'item');
    row.dataset.id = it.id;
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.dataset.id = it.id;
    cb.onchange = () => setItem(it.id, cb.checked);
    row.appendChild(cb);
    const right = el('div');
    right.appendChild(el('div', 'title', it.title));
    right.appendChild(el('div', 'desc', it.desc));
    const meta = el('div', 'meta');
    meta.appendChild(el('span', 'chip', '↻ ' + it.commit));
    meta.appendChild(el('span', 'chip ' + it.size, it.size));
    if (it.dep) meta.appendChild(el('span', 'chip dep', '⚑ ' + it.dep));
    right.appendChild(meta);
    row.appendChild(right);
    sec.appendChild(row);
  }
  body.appendChild(sec);
}

function setItem(id, on) {
  state[id] = on;
  const row = document.querySelector(`.item[data-id="${id}"]`);
  if (!row) return;
  row.querySelector('input').checked = on;
  row.classList.toggle('checked', on);
  refresh();
}

function setAll(on) {
  for (const g of GROUPS) for (const it of g.items) setItem(it.id, on);
}

function selectedItems() {
  const out = [];
  for (const g of GROUPS) {
    for (const it of g.items) if (state[it.id]) out.push({ group: g.name, ...it });
  }
  return out;
}

function buildText() {
  const sel = selectedItems();
  const lines = [];
  lines.push(`Pull these into droid-office (${sel.length} selected):`);
  let group = null;
  for (const it of sel) {
    if (it.group !== group) { group = it.group; lines.push('', `## ${group}`); }
    lines.push(`- [${it.commit}] ${it.title}${it.dep ? ` (dep: ${it.dep})` : ''}`);
    lines.push(`  ${it.desc}`);
  }
  return lines.join('\n');
}

function refresh() {
  const n = selectedItems().length;
  document.getElementById('count').textContent = `${n} of ${Object.keys(state).length} selected`;
  document.getElementById('footcount').textContent = `${n} selected`;
  const prev = document.getElementById('preview');
  if (prev) prev.value = buildText();
}

function togglePreview() {
  let prev = document.getElementById('preview');
  if (prev) { prev.remove(); return; }
  const d = el('details', 'preview');
  d.open = true;
  d.appendChild(el('summary', null, 'Copy preview'));
  prev = document.createElement('textarea');
  prev.id = 'preview';
  d.appendChild(prev);
  document.querySelector('main').prepend(d);
  refresh();
}

async function copySelection() {
  const text = buildText();
  try {
    await navigator.clipboard.writeText(text);
    toast('Copied to clipboard');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast('Copied to clipboard');
  }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

document.getElementById('filter').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  for (const row of document.querySelectorAll('.item')) {
    const it = findItem(row.dataset.id);
    const hay = (it.title + ' ' + it.desc + ' ' + it.commit + ' ' + (it.dep || '')).toLowerCase();
    row.classList.toggle('hidden', q !== '' && !hay.includes(q));
  }
});

function findItem(id) {
  for (const g of GROUPS) for (const it of g.items) if (it.id === id) return it;
  return { title: '', desc: '', commit: '' };
}

refresh();
</script>
