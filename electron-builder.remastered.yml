# Droid Office Remastered: this checkout's app under its own name and bundle id, with the Remastered renderer.
# `npm run package:remastered` builds it into release/remastered/. It shares Droid Office's userData folder (and so its
# preferences, office folder and port), never updates itself, and is never published (src/desktop/edition.ts).
extends: ./electron-builder.yml
appId: com.nikships.droid-office-remastered
productName: Droid Office Remastered
extraMetadata:
  productName: Droid Office Remastered
  remastered: true

directories:
  output: release/remastered
  buildResources: build

mac:
  icon: build/icon-remastered.png
  artifactName: Droid-Office-Remastered-${version}-${arch}.${ext}
  target:
    - target: dir
      arch: [arm64]

publish: null
