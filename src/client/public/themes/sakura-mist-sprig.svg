<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <style>
    @media (max-height: 80px) { .spray { transform: scale(.58); opacity: .22; } }
  </style>
  <defs>
    <path id="petal" d="M0 0C-1.8-1.4-4.1-4.8-2.3-7.2Q-1.3-8.3 0-6.7Q1.4-8.3 2.4-7.1C4.3-4.9 1.8-1.3 0 0Z"/>
    <g id="flower">
      <use href="#petal"/><use href="#petal" transform="rotate(72)"/><use href="#petal" transform="rotate(144)"/>
      <use href="#petal" transform="rotate(216)"/><use href="#petal" transform="rotate(288)"/>
      <circle r="1.1" fill="#f6ceab"/>
    </g>
  </defs>
  <!-- Anchor the spray, not a repeating tile, to each surface's upper right corner. -->
  <svg x="100%" overflow="visible">
    <g class="spray" opacity=".66">
      <path fill="#c493a1" d="M4 1C-13 2-23 18-42 20C-64 22-78 14-106 23C-83 12-66 17-48 17C-32 17-19 5-9-2Z"/>
      <path fill="none" stroke="#c493a1" stroke-linecap="round" d="M-28 15Q-37 29-56 38M-42 20Q-48 12-58 9M-71 18Q-80 23-85 29M-89 18Q-99 13-112 15M-16 8Q-17 23-28 27"/>
      <g fill="#edb4c7">
        <use href="#flower" transform="translate(-48 16) rotate(24) scale(1.04)"/>
        <use href="#flower" transform="translate(-79 23) rotate(-11) scale(.69)"/>
        <use href="#flower" transform="translate(-31 29) rotate(19) scale(.81)"/>
        <use href="#flower" transform="translate(-17 4) rotate(-14) scale(.75)"/>
      </g>
      <g fill="#d88eaa">
        <use href="#petal" transform="translate(-54 38) rotate(-115) scale(.85)"/>
        <use href="#petal" transform="translate(-58 9) rotate(-47) scale(.85)"/>
        <use href="#petal" transform="translate(-105 18) rotate(-104) scale(.78)"/>
        <use href="#petal" transform="translate(-93 41) rotate(-120) scale(.7)"/>
      </g>
    </g>
  </svg>
</svg>
