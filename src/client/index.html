<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="office-revision" content="" />
    <script src="/api/hot-reload/client.js" defer></script>
    <title>Droid Office</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#020202" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Up from the first paint until the office has drawn (see ui/loading.ts). -->
    <div id="loading" role="status" aria-live="polite">
      <div class="loading-card">
        <img class="loading-mark" src="/factory-glyph.svg" width="36" height="36" alt="" />
        <div class="loading-name">Droid Office</div>
        <div class="loading-bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="loading-fill"></span></div>
        <p class="loading-say">Loading the office</p>
      </div>
    </div>
    <div id="app">
      <canvas id="scene" tabindex="-1"></canvas>
      <div id="fade"></div>
      <div id="fps" aria-hidden="true"></div>
      <div id="hud">
        <div id="compass"></div>
        <header class="topbar">
          <div class="project panel" id="project" role="button" tabindex="-1" title="Floors: go to another project">
            <div class="project-name"><img class="glyph" src="/factory-glyph.svg" width="15" height="15" alt="" /><span id="project-name">Droid Office</span><span id="floors-waiting" class="svc-count hidden"></span></div>
            <div class="project-meta" id="project-meta"></div>
          </div>
          <!-- Filled by ui/menu.ts: pinned actions, what needs you right now, and the ☰ menu with everything else. -->
          <nav id="dock" class="dock" aria-label="Office"></nav>
        </header>
        <aside class="side">
          <section id="workers-panel" class="panel workers">
            <h3><span class="no">01</span> Workers <span id="worker-count" class="count"></span><button class="panel-x" data-hud="workers" aria-label="Hide" title="Hide (☰ brings it back)">✕</button></h3>
            <button id="waiting" class="hidden" title="Go to the worker that has waited longest on someone (N)"></button>
            <ul id="workers"></ul>
          </section>
        </aside>
        <div id="crosshair" class="crosshair hidden"><span class="look-hint">Click to look around</span></div>
        <div id="hint" class="hint hidden"></div>
        <div id="toasts"></div>
        <div id="caffeine" class="caffeine panel hidden" aria-label="Coffee buzz left">
          <span id="caffeine-cups"></span>
          <span class="bar"><span id="caffeine-fill"></span></span>
          <span id="caffeine-left" class="left"></span>
        </div>
        <div id="conn" class="conn hidden">Reconnecting…</div>
        <div id="upgrade-banner" class="conn upgrading hidden"></div>
      </div>
      <div id="modal-root"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
