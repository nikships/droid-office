name: Release

# Every change to the app that lands on main is built, tested and published as a GitHub release
# marked Latest: install.sh installs its tarball, and the Mac app (src/desktop) updates itself to
# it through electron-updater, which reads the release's latest-mac.yml. Every release gets a new
# version, package.json's major.minor plus the number of commits on main (v0.1.68, v0.1.69, ...),
# so the app always sees it as newer; bump package.json for a new minor.
#
# The Android app (android/) is built and tested alongside, and its APK is attached to the release.
#
# Pull requests get the same build, tests, a real install of the packed release through install.sh,
# an unsigned build of the Mac app and the Android APK, but publish nothing.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'bin/**'
      - 'tests/**'
      - '.husky/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'biome.jsonc'
      - 'install.sh'
      - 'install.ps1'
      - '.env.example'
      - '.gitignore'
      - 'electron-builder.yml'
      - 'build/**'
      - 'android/**'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'bin/**'
      - 'tests/**'
      - '.husky/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'biome.jsonc'
      - 'install.sh'
      - 'install.ps1'
      - '.env.example'
      - '.gitignore'
      - 'electron-builder.yml'
      - 'build/**'
      - 'android/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Electron is only for the Mac app, which the mac job builds.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version counts the commits on main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: npm ci # its prepare script builds the client and the server

      - run: npm run lint

      - run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage # fails below the line and function thresholds in package.json

      - name: Pack the release
        id: pack
        run: |
          version="$(node -p 'require("./package.json").version.split(".").slice(0, 2).join(".")').$(git rev-list --count HEAD)"
          npm version "$version" --no-git-tag-version --allow-same-version
          # It's built already, and installs don't have the build tools.
          npm pkg delete scripts.prepare
          # Installs get exactly the dependency versions tested here.
          cp package-lock.json npm-shrinkwrap.json
          npm pkg set 'files[]=npm-shrinkwrap.json'
          npm pack --ignore-scripts
          mv "droid-office-$version.tgz" droid-office.tgz
          tar -tzf droid-office.tgz | grep -qx 'package/npm-shrinkwrap.json'
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install it with install.sh and start it
        env:
          DROID_OFFICE_TARBALL: ${{ github.workspace }}/droid-office.tgz
          DROID_OFFICE_INSTALL_DIR: ${{ runner.temp }}/install
          DROID_OFFICE_BIN_DIR: ${{ runner.temp }}/bin
          DROID_OFFICE_HOME: ${{ runner.temp }}/office
          DROID_OFFICE_INSTALL_ONLY: '1'
        run: |
          bash install.sh
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/bin/droid-office" --host 127.0.0.1 --port 4700 > office.log 2>&1 &
          office=$!
          for _ in $(seq 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4700/ || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          cat office.log
          [ "$code" = 200 ] || { echo "the installed office didn't answer (last status: $code)"; exit 1; }
          grep -qx "v${{ steps.pack.outputs.version }}" install/current
          kill -INT "$office"

      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: droid-office.tgz
          if-no-files-found: error

  mac:
    runs-on: macos-26
    env:
      # Signed and notarized only for a release; a pull request's build skips both.
      PUBLISHING: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version counts the commits on main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: npm ci # its prepare script builds the client, the server and the app's main process

      - name: Set the release version
        id: version
        run: |
          version="$(node -p 'require("./package.json").version.split(".").slice(0, 2).join(".")').$(git rev-list --count HEAD)"
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # electron-builder's own keychain for CSC_LINK fails on macos-26 (set-key-partition-list can't
      # unlock it), so the certificate goes into a keychain made here, which it then finds by name.
      - name: Import the Developer ID certificate
        if: env.PUBLISHING == 'true'
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -base64 24)"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          echo "$MAC_CERTS" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # Lets codesign use the key without a prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" login.keychain
          security default-keychain -s "$kc"
          security find-identity -v -p codesigning "$kc" | grep -q 'Developer ID Application: Nikhil Anand (NW6B3R27LQ)'

      - name: Build, sign and notarize the app
        if: env.PUBLISHING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --arm64 --publish never

      - name: Build the app unsigned
        if: env.PUBLISHING != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --arm64 --publish never -c.mac.identity=null

      # On the Helper binary, as src/desktop/runtime.ts runs it, so this is the signed binary the app uses.
      - name: Start the office on the app's own Electron
        run: |
          app="release/mac-arm64/Droid Office.app"
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/Frameworks/Droid Office Helper.app/Contents/MacOS/Droid Office Helper" "$app/Contents/Resources/app/bin/droid-office.js" \
            --home "$RUNNER_TEMP/office" --host 127.0.0.1 --port 4700 > office.log 2>&1 &
          office=$!
          for _ in $(seq 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4700/ || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          cat office.log
          [ "$code" = 200 ] || { echo "the app's office didn't answer (last status: $code)"; exit 1; }
          kill -INT "$office"
          grep -qx "version: ${{ steps.version.outputs.version }}" release/latest-mac.yml

      - name: Check the signature and notarize the disk image
        if: env.PUBLISHING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app="release/mac-arm64/Droid Office.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute -vv "$app" 2>&1 | tee spctl.log
          grep -q 'source=Notarized Developer ID' spctl.log
          # electron-builder notarizes the app inside; the disk image around it gets its own ticket.
          dmg="release/Droid-Office-${{ steps.version.outputs.version }}-arm64.dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg" 2>&1 | tee spctl-dmg.log
          grep -q 'source=Notarized Developer ID' spctl-dmg.log

      - uses: actions/upload-artifact@v7
        with:
          name: mac
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version counts the commits on main

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Set the release version
        id: version
        working-directory: .
        run: |
          count="$(git rev-list --count HEAD)"
          version="$(node -p 'require("./package.json").version.split(".").slice(0, 2).join(".")').$count"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$count" >> "$GITHUB_OUTPUT"

      - name: Unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      # Signed with the repository's release keystore (the ANDROID_KEYSTORE_* and ANDROID_KEY_*
      # secrets), so each release installs over the last. A pull request from a fork gets no secrets:
      # its APK is signed with a debug key this runner just made, new each run, which installs but
      # never as an update over a release.
      - name: Build the release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew --no-daemon assembleRelease \
            -PofficeVersion=${{ steps.version.outputs.version }} -PofficeVersionCode=${{ steps.version.outputs.code }}
          mkdir -p out
          apk="out/Droid-Office-${{ steps.version.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          certs="$("$apksigner" verify --print-certs "$apk")"
          echo "$certs" | grep -E 'certificate (DN|SHA-256)'
          # With the release keystore given, a debug-signed APK would be a release that can't update.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::The APK is debug-signed even though the release keystore was given"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: android/out/*.apk
          if-no-files-found: error

  publish:
    needs: [release, mac, android]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.release.outputs.version }}
        run: |
          grep -qx "version: ${{ needs.release.outputs.version }}" assets/latest-mac.yml
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A rerun: replace the assets together, so latest-mac.yml matches the zip it lists.
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" assets/* \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
          fi
