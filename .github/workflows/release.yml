name: Release

# App changes that land on main are built, tested and published as a GitHub release marked Latest.
# Only affected platforms are rebuilt; unchanged platform assets retain their original versions
# on the new release so both apps' existing Latest-release update feeds keep working.
# The Mac app updates through electron-updater, which reads latest-mac.yml. Every release gets a new
# version, package.json's major.minor plus the number of commits on main (v0.1.68, v0.1.69, ...),
# so the app always sees it as newer; bump package.json for a new minor.
#
# PRs and pushes use the same path filters for Node checks, the website and each platform.
# PRs compile and test, but never version, package, sign or upload release artifacts.
# Test/docs-only changes publish nothing. Manual runs check everything, releasing only on main.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'website/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'bin/**'
      - 'tests/**'
      - 'README.md'
      - 'docs/guide/**'
      - '.agents/skills/office-video-capture/references/example-launch/example-composition.html'
      - '.husky/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'metro.config.cjs'
      - 'babel.config.cjs'
      - 'react-native.config.cjs'
      - 'index.mobile.js'
      - 'biome.jsonc'
      - '.env.example'
      - '.gitignore'
      - 'electron-builder.yml'
      - 'build/**'
      - 'native/**'
      - 'android/**'
      - '.github/workflows/release.yml'
      - '.github/scripts/release-*.mjs'
      - 'tools/android-*.mjs'
      - 'tools/props/**'
      - 'tools/frame-bench/**'
      - '.agents/skills/office-clone/**'
      - '.agents/skills/office-3d-testing/**'
      - '.agents/skills/office-thermals/**'
      - '.agents/skills/performance-proof/**'
  pull_request:
    paths:
      - 'src/**'
      - 'website/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'bin/**'
      - 'tests/**'
      - 'README.md'
      - 'docs/guide/**'
      - '.agents/skills/office-video-capture/references/example-launch/example-composition.html'
      - '.husky/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'metro.config.cjs'
      - 'babel.config.cjs'
      - 'react-native.config.cjs'
      - 'index.mobile.js'
      - 'biome.jsonc'
      - '.env.example'
      - '.gitignore'
      - 'electron-builder.yml'
      - 'build/**'
      - 'native/**'
      - 'android/**'
      - '.github/workflows/release.yml'
      - '.github/scripts/release-*.mjs'
      - 'tools/android-*.mjs'
      - 'tools/props/**'
      - 'tools/frame-bench/**'
      - '.agents/skills/office-clone/**'
      - '.agents/skills/office-3d-testing/**'
      - '.agents/skills/office-thermals/**'
      - '.agents/skills/performance-proof/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLISHING: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.paths.outputs.node }}
      website: ${{ steps.paths.outputs.website }}
      mac: ${{ steps.paths.outputs.mac }}
      android: ${{ steps.paths.outputs.android }}
      version: ${{ steps.paths.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Find the checks and platforms this change can affect
        id: paths
        run: node .github/scripts/release-changes.mjs

  release:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Electron is only for the Mac app, which the mac job builds.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: npm ci # its prepare script builds the client and the server

      - run: npm run lint

      - run: npm run typecheck

      # The Whiteboard renderer's tests start a real headless Chromium, with its sandbox on. It lives
      # outside the workspace, in the one folder the office and the Mac app share.
      - name: Choose the shared Chromium folder
        run: echo "DROID_OFFICE_BROWSERS_PATH=$RUNNER_TEMP/browsers" >> "$GITHUB_ENV"

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/browsers
          key: chromium-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}

      - name: Install Chromium and its libraries
        run: |
          # The download, through playwright-core's bundled CLI; a cache hit makes it a no-op.
          node bin/droid-office.js browser install
          sudo node node_modules/playwright-core/cli.js install-deps chromium
          # Ubuntu 24.04 blocks the user namespaces Chromium's sandbox needs unless AppArmor allows them
          # for its binary: the profile deploy/provision.sh installs on the AWS box.
          if [ -e /etc/apparmor.d/abi/4.0 ]; then
            node bin/droid-office.js browser apparmor-profile | sudo tee /etc/apparmor.d/droid-office-chromium > /dev/null
            sudo apparmor_parser -r /etc/apparmor.d/droid-office-chromium
          fi

      - name: Test with coverage
        run: npm run test:coverage # fails below the line and function thresholds in package.json

      - name: Test the Office performance proof contract
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -s .agents/skills/performance-proof/tests -p 'test*.py' -v

      - name: Verify prop geometry and embedded textures
        run: node tools/props/verify.mjs

      - name: Set the release version
        if: env.PUBLISHING == 'true'
        id: version
        run: |
          version="${{ needs.changes.outputs.version }}"
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Start the office from the checkout
        env:
          DROID_OFFICE_HOME: ${{ runner.temp }}/office
        run: |
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/bin/droid-office.js" --host 127.0.0.1 --port 4700 > office.log 2>&1 &
          office=$!
          trap 'kill -INT "$office" 2>/dev/null || true' EXIT
          for _ in $(seq 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4700/ || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          cat office.log
          [ "$code" = 200 ] || { echo "the checkout's office didn't answer (last status: $code)"; exit 1; }
          dash=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4700/dashboard || true)
          [ "$dash" = 200 ] || { echo "the checkout's desktop companion didn't answer (last status: $dash)"; exit 1; }

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # No office build, Chromium or native dependencies are needed to check the website.
      - run: npm ci --ignore-scripts
      # The Node job's repository-wide checks already include the website.
      - run: npx biome check --error-on-warnings website
        if: needs.changes.outputs.node != 'true'
      - run: npm run typecheck --workspace website
        if: needs.changes.outputs.node != 'true'
      - run: npm run build:website

  mac:
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        env:
          # PRs compile the Node-API presenter without downloading the unused Electron runtime.
          ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ env.PUBLISHING != 'true' && '1' || '' }}
        run: npm ci # its prepare script builds the client, the server, the app's main process and the native Metal presenter

      - name: Check the native Metal presenter was built for the Mac app
        run: |
          node="native/presenter/build/Release/presenter.node"
          test -f "$node"
          lipo -archs "$node" | grep -qx arm64
          # Built for macOS 14, the app's floor (minos in LC_BUILD_VERSION).
          vtool -show-build "$node" | tee vtool.log
          grep -Eq 'minos 14\.0' vtool.log

      - name: Check the native Finder integration
        run: |
          node --import tsx --test tests/finder-native.test.ts
          extension="native/mac/build/DroidOfficeFinderSync.appex/Contents/MacOS/DroidOfficeFinderSync"
          bridge="native/mac/build/DroidOfficeFinderBridge.app/Contents/MacOS/DroidOfficeFinderBridge"
          test -f "$extension"
          test -f "$bridge"
          lipo -archs "$extension" | grep -qx arm64
          lipo -archs "$bridge" | grep -qx arm64

      - name: Set the release version
        if: env.PUBLISHING == 'true'
        id: version
        run: |
          version="${{ needs.changes.outputs.version }}"
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Stamp the Finder bundle release versions
        if: env.PUBLISHING == 'true'
        run: node native/mac/build.mjs

      # electron-builder's own keychain for CSC_LINK fails on macos-26 (set-key-partition-list can't
      # unlock it), so the certificate goes into a keychain made here, which it then finds by name.
      - name: Import the Developer ID certificate
        if: env.PUBLISHING == 'true'
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -base64 24)"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          echo "$MAC_CERTS" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # Lets codesign use the key without a prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" login.keychain
          security default-keychain -s "$kc"
          security find-identity -v -p codesigning "$kc" | grep -q 'Developer ID Application: Nikhil Anand (NW6B3R27LQ)'

      - name: Install Finder Developer ID provisioning profiles
        if: env.PUBLISHING == 'true'
        env:
          FINDER_BRIDGE_PROFILE_BASE64: ${{ secrets.FINDER_BRIDGE_PROFILE_BASE64 }}
          FINDER_SYNC_PROFILE_BASE64: ${{ secrets.FINDER_SYNC_PROFILE_BASE64 }}
        run: |
          test -n "$FINDER_BRIDGE_PROFILE_BASE64" || { echo "Missing Finder bridge Developer ID provisioning profile"; exit 1; }
          test -n "$FINDER_SYNC_PROFILE_BASE64" || { echo "Missing FinderSync Developer ID provisioning profile"; exit 1; }
          umask 077
          mkdir -p native/mac/build/signing
          printf '%s' "$FINDER_BRIDGE_PROFILE_BASE64" | base64 --decode > native/mac/build/signing/FinderBridge.provisionprofile
          printf '%s' "$FINDER_SYNC_PROFILE_BASE64" | base64 --decode > native/mac/build/signing/FinderSync.provisionprofile

      - name: Build, sign and notarize the app
        if: env.PUBLISHING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --arm64 --publish never

      # The macOS 14 floor for electron-updater, which compares it with the Darwin version (23 is macOS 14),
      # so a Mac on macOS 13 or earlier is never offered a build that refuses to open there.
      - name: Require macOS 14 in the update metadata
        if: env.PUBLISHING == 'true'
        run: |
          grep -q '^minimumSystemVersion:' release/latest-mac.yml || echo 'minimumSystemVersion: 23.0.0' >> release/latest-mac.yml
          grep -qx 'minimumSystemVersion: 23.0.0' release/latest-mac.yml
          app="release/mac-arm64/Droid Office.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 14.0

      # The app's own main process, with no window: the macOS 14 and chip gates, the presenter module loading from the
      # bundle, then exit 0. The runner is a base-chip virtual machine, so the check passes only with the CI-only
      # DROID_OFFICE_ALLOW_ANY_CHIP, and must refuse without it. A fresh user-data folder keeps it off any other
      # instance's lock and settings.
      - name: Check the app's startup gates
        if: env.PUBLISHING == 'true'
        run: |
          app="release/mac-arm64/Droid Office.app"
          bin="$app/Contents/MacOS/Droid Office"
          chip="$(sysctl -n machdep.cpu.brand_string)"
          echo "runner chip: $chip"
          DROID_OFFICE_ALLOW_ANY_CHIP=1 "$bin" --startup-check --user-data-dir="$RUNNER_TEMP/startup-check-1" | tee startup-check.log
          grep -q '^startup-check ok' startup-check.log
          grep -q '"presenter":{' startup-check.log
          # startup-check exits 1 unless the presenter's probe made a Metal device, imported an IOSurface and made a layer.
          grep -q '"probe":{' startup-check.log
          test -f "$app/Contents/Resources/app/native/presenter/build/Release/presenter.node"
          if echo "$chip" | grep -Eq '^Apple M[0-9]+ (Pro|Max|Ultra)$'; then
            "$bin" --startup-check --user-data-dir="$RUNNER_TEMP/startup-check-2"
          else
            if "$bin" --startup-check --user-data-dir="$RUNNER_TEMP/startup-check-2" 2> startup-refusal.log; then
              echo "the app started on a base chip without DROID_OFFICE_ALLOW_ANY_CHIP"; exit 1
            fi
            cat startup-refusal.log
            grep -q 'startup failure \[chip\]' startup-refusal.log
          fi

      # On the Helper binary, as src/desktop/runtime.ts runs it, so this is the signed binary the app uses.
      - name: Start the office on the app's own Electron
        if: env.PUBLISHING == 'true'
        run: |
          app="release/mac-arm64/Droid Office.app"
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/Frameworks/Droid Office Helper.app/Contents/MacOS/Droid Office Helper" "$app/Contents/Resources/app/bin/droid-office.js" \
            --home "$RUNNER_TEMP/office" --host 127.0.0.1 --port 4700 > office.log 2>&1 &
          office=$!
          trap 'kill -INT "$office" 2>/dev/null || true' EXIT
          for _ in $(seq 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4700/ || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          cat office.log
          [ "$code" = 200 ] || { echo "the app's office didn't answer (last status: $code)"; exit 1; }
          dash=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4700/dashboard || true)
          [ "$dash" = 200 ] || { echo "the app's desktop companion didn't answer (last status: $dash)"; exit 1; }
          kill -INT "$office"
          grep -qx "version: ${{ steps.version.outputs.version }}" release/latest-mac.yml

      - name: Check the signature and notarize the disk image
        if: env.PUBLISHING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app="release/mac-arm64/Droid Office.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          extension="$app/Contents/PlugIns/DroidOfficeFinderSync.appex"
          bridge="$app/Contents/Resources/app/native/mac/build/DroidOfficeFinderBridge.app"
          test -f "$extension/Contents/embedded.provisionprofile"
          test -f "$bridge/Contents/embedded.provisionprofile"
          codesign --verify --strict --verbose=2 "$extension"
          codesign --verify --strict --verbose=2 "$bridge"
          for bundle in "$extension" "$bridge"; do
            codesign -d --entitlements - --xml "$bundle" > finder-entitlements.plist 2>/dev/null
            plutil -convert json -o finder-entitlements.json finder-entitlements.plist
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const e = JSON.parse(readFileSync("finder-entitlements.json", "utf8"));
              const extension = process.argv[1].endsWith(".appex");
              if ((extension && (e["com.apple.security.app-sandbox"] !== true ||
                                 e["com.apple.security.network.client"] !== true)) ||
                  (!extension && e["com.apple.security.app-sandbox"] === true) ||
                  e["com.apple.developer.team-identifier"] !== "NW6B3R27LQ" ||
                  !e["com.apple.security.application-groups"]?.includes("group.com.nikships.droid-office") ||
                  !e["keychain-access-groups"]?.includes("NW6B3R27LQ.group.com.nikships.droid-office"))
                throw new Error("Final Finder signature lost its required entitlements");
            ' "$bundle"
            codesign -dvv "$bundle" 2> finder-signature.log
            grep -q 'TeamIdentifier=NW6B3R27LQ' finder-signature.log
            grep -q 'flags=0x10000(runtime)' finder-signature.log
            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")"
            lipo -archs "$bundle/Contents/MacOS/$executable" | grep -qx arm64
          done
          # The presenter is its own signed Mach-O: Developer ID, hardened runtime, the app's team.
          node="$app/Contents/Resources/app/native/presenter/build/Release/presenter.node"
          codesign --verify --strict --verbose=2 "$node"
          codesign -dvv "$node" 2>&1 | tee presenter-signature.log
          grep -q 'TeamIdentifier=NW6B3R27LQ' presenter-signature.log
          grep -q 'flags=0x10000(runtime)' presenter-signature.log
          spctl --assess --type execute -vv "$app" 2>&1 | tee spctl.log
          grep -q 'source=Notarized Developer ID' spctl.log
          # electron-builder notarizes the app inside; the disk image around it gets its own ticket.
          dmg="release/Droid-Office-${{ steps.version.outputs.version }}-arm64.dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg" 2>&1 | tee spctl-dmg.log
          grep -q 'source=Notarized Developer ID' spctl-dmg.log

      - uses: actions/upload-artifact@v7
        if: env.PUBLISHING == 'true'
        with:
          name: mac
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install React Native build dependencies
        working-directory: .
        run: npm ci --ignore-scripts

      - name: Build shared Android management panels
        working-directory: .
        run: node tools/android-companion-tools.mjs

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Set the release version
        if: env.PUBLISHING == 'true'
        id: version
        working-directory: .
        run: |
          version="${{ needs.changes.outputs.version }}"
          count="${version##*.}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$count" >> "$GITHUB_OUTPUT"

      - name: Unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Compile the Android release on pull requests
        if: env.PUBLISHING != 'true'
        run: ./gradlew --no-daemon assembleRelease

      # Signed with the repository's release keystore (the ANDROID_KEYSTORE_* and ANDROID_KEY_*
      # secrets), so each release installs over the last. PRs compile without release credentials.
      - name: Build the release APK
        if: env.PUBLISHING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew --no-daemon assembleRelease \
            -PofficeVersion=${{ steps.version.outputs.version }} -PofficeVersionCode=${{ steps.version.outputs.code }}
          mkdir -p out
          apk="out/Droid-Office-${{ steps.version.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner="$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          certs="$("$apksigner" verify --print-certs "$apk")"
          echo "$certs" | grep -E 'certificate (DN|SHA-256)'
          # With the release keystore given, a debug-signed APK would be a release that can't update.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::The APK is debug-signed even though the release keystore was given"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: env.PUBLISHING == 'true'
        with:
          name: android
          path: android/out/*.apk
          if-no-files-found: error

  publish:
    needs: [changes, release, website, mac, android]
    # always() lets unaffected (skipped) jobs coexist with the platform that actually built.
    # Never publish after a failure/cancellation, or when no app changed.
    if: >-
      always() && !cancelled() &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped') &&
      (needs.website.result == 'success' || needs.website.result == 'skipped') &&
      (needs.mac.result == 'success' || needs.mac.result == 'skipped') &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (needs.mac.result == 'success' || needs.android.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.changes.outputs.version }}
          MAC_CHANGED: ${{ needs.changes.outputs.mac }}
          ANDROID_CHANGED: ${{ needs.changes.outputs.android }}
        run: |
          # Both installed apps read Latest. Preserve the other app's signed binaries and version
          # rather than rebuilding it or leaving its update feed without an installable app.
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ "${latest##*.}" -gt "${TAG##*.}" ]; then
            echo "A newer release is already published; not promoting this older run."
            exit 0
          fi
          if [ "$MAC_CHANGED" != true ]; then
            gh release download "$latest" --dir assets \
              --pattern '*.dmg' --pattern '*.zip' --pattern '*.blockmap' --pattern 'latest-mac.yml'
          else
            grep -qx "version: ${{ needs.changes.outputs.version }}" assets/latest-mac.yml
          fi
          if [ "$ANDROID_CHANGED" != true ]; then
            gh release download "$latest" --dir assets --pattern '*.apk'
          fi
          test -f assets/latest-mac.yml
          compgen -G 'assets/*.zip' > /dev/null
          compgen -G 'assets/*.dmg' > /dev/null
          compgen -G 'assets/*.apk' > /dev/null
          notes="Rebuilt platforms: macOS=$MAC_CHANGED, Android=$ANDROID_CHANGED. Other platform assets retain their original versions."
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A rerun: replace the assets together, so latest-mac.yml matches the zip it lists.
            gh release upload "$TAG" assets/* --clobber
          else
            # Publish only once all assets are uploaded, so neither updater sees a partial release.
            gh release create "$TAG" assets/* --draft \
              --target "$GITHUB_SHA" --title "$TAG" --notes "$notes" --generate-notes
          fi
          gh release edit "$TAG" --draft=false --latest
