# factory-automation: ecb3a486-716a-462e-a142-1678fe259400
name: Droid Code Review
"on":
  workflow_dispatch: {}
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Factory droid-action
        uses: Factory-AI/droid-action@main
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          review_depth: deep
