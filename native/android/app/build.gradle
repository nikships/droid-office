plugins { id 'com.android.application' }

android {
    namespace 'dev.droidoffice.xr'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'dev.droidoffice.xr'
        minSdk 29
        targetSdk 35
        versionCode providers.gradleProperty('officeVersionCode').getOrElse('1').toInteger()
        versionName providers.gradleProperty('officeVersionName').getOrElse('0.1-dev')
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -Wall -Wextra -Werror=return-type' }
        }
    }
    buildFeatures { prefab true; buildConfig true }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    buildTypes {
        // Debug builds only; release libraries contain neither:
        // - the Vulkan eye-tracked foveation spike (native/android/app/src/main/cpp/vk_spike*);
        // - the capture puppet (synthetic controllers for headless captures). The Java host also
        //   requires BuildConfig.DEBUG.
        debug {
            externalNativeBuild {
                cmake { arguments '-DOFFICE_CAPTURE_PUPPET=ON', '-DOFFICE_VULKAN_SPIKE=ON' }
            }
        }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.63'
}
