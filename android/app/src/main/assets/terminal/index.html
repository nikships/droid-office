<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data:">
<title>Terminal</title>
<link rel="stylesheet" href="vendor/android-terminal.css">
<style>
  /* The app serves these from its own font resources (ui/worker/TerminalPage.kt). */
  @font-face {
    font-family: 'Geist Mono';
    src: url('/fonts/geist_mono.ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
  }
  @font-face {
    font-family: 'Droid Office Terminal Symbols';
    src: url('/fonts/terminal_symbols.ttf') format('truetype');
    font-weight: 400 700;
    font-style: normal;
    unicode-range: U+E000-F8FF, U+F0000-F0FFF;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  html, body { background-color: var(--terminal-ground, #000000); }
  #term {
    position: absolute;
    top: 8px;
    left: 8px;
    width: calc(100% - 16px);
    height: calc(100% - 16px);
  }
  #term .office-wterm { overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
  #term .office-wterm.program-swipe { touch-action: none; }
  #term .office-wterm::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="term"></div>
<script src="boot.js"></script>
</body>
</html>
